name: Reproduce manuscript figures
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python code/main.py --analyze
      - run: python tests/artifact_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-figures-${{ matrix.os }}-${{ matrix.python }}
          path: result/
